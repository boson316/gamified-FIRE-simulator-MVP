name: ci-gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Python test + coverage (src only)
        run: pytest --cov=src --cov-fail-under=70 -q

      - name: Web test (compound math)
        run: npm run test
        working-directory: web

      - name: Run benchmark
        run: python scripts/run_benchmark.py --out artifacts

      - name: Evaluate gate
        run: |
          python scripts/evaluate_gates.py \
            --baseline artifacts/baseline_metrics.json \
            --optimized artifacts/optimized_metrics.json \
            --out artifacts/gate_result.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: artifacts/
